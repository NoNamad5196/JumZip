project_id = "jumzip"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
[local_smtp]
enabled = true
port = 54324
[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/auth", "http://localhost:5173/auth"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = true
enable_manual_linking = true
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
[edge_runtime]
enabled = true
policy = "per_worker"
[functions.chat]
verify_jwt = false
import_map = "./functions/deno.json"
[functions.tarot]
verify_jwt = false
import_map = "./functions/deno.json"
[functions.saju]
verify_jwt = false
import_map = "./functions/deno.json"
[functions.compatibility]
verify_jwt = false
import_map = "./functions/deno.json"
[functions.account]
verify_jwt = false
import_map = "./functions/deno.json"
